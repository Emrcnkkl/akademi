<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin | 24 Akademi</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div id="loading" class="login-wrap"><div class="muted">Yükleniyor…</div></div>

<div id="appView" class="hidden">
  <header class="app-top">
    <div class="container">
      <a href="index.html" class="logo"><img src="assets/logo-24-sm.png" alt="24 Akademi" style="height:40px" /></a>
      <div class="user-chip">
        <span class="badge err">Yönetici</span>
        <span class="avatar" id="meAvatar"></span>
        <b id="meName"></b>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Çıkış</button>
      </div>
    </div>
  </header>
  <main class="app-main">
    <div class="container">
      <div class="spread"><div class="page-title">Yönetim paneli</div><button class="btn btn-accent btn-sm" id="newUserBtn">+ Yeni kullanıcı</button></div>
      <div class="tabs" id="aTabs" style="margin-top:1rem">
        <button class="on" data-t="genel">Genel bakış</button>
        <button data-t="ogrBas">Öğrenci başvuruları <span class="badge warn" id="cntOgr"></span></button>
        <button data-t="mentorBas">Koç başvuruları <span class="badge warn" id="cntMen"></span></button>
        <button data-t="odeme">Ödemeler <span class="badge err" id="cntOde"></span></button>
        <button data-t="rapor">Veli raporları <span class="badge warn" id="cntRap"></span></button>
        <button data-t="kullanici">Kullanıcılar</button>
      </div>
      <div id="aBody"></div>
    </div>
  </main>
</div>

<script type="module" src="assets/admin.js"></script>
</body>
</html>
